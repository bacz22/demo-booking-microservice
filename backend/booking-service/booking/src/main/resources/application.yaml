spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${DB_NAME:booking_db}
    username: ${DB_USERNAME:cinebook}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: booking-service-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:20}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}

  jackson:
    time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Producer/consumer được cấu hình trong config/KafkaConfig (acks=all, idempotence, String serde).
    consumer:
      group-id: booking-service

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}]"

app:
  kafka:
    topics:
      payment-events: payment.events
      booking-events: booking.events
  outbox:
    publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-delay-ms: ${OUTBOX_POLL_DELAY_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:100}

booking:
  hold-ttl-seconds: ${BOOKING_HOLD_TTL_SECONDS:300}
  max-seats-per-booking: ${BOOKING_MAX_SEATS:8}
  redis-required: ${BOOKING_REDIS_REQUIRED:true}
  # Bật thanh toán giả lập để test toàn bộ luồng giữ ghế -> xác nhận booking.
  # Có thể tắt lại bằng biến môi trường BOOKING_MOCK_PAYMENT_ENABLED=false.
  mock-payment-enabled: ${BOOKING_MOCK_PAYMENT_ENABLED:true}
  internal:
    service-key: ${BOOKING_SERVICE_KEY:local-dev-service-key}
  idempotency:
    mutex-ttl-seconds: ${BOOKING_IDEMPOTENCY_MUTEX_TTL_SECONDS:30}
    fingerprint-ttl-seconds: ${BOOKING_IDEMPOTENCY_FINGERPRINT_TTL_SECONDS:600}
  expiration:
    enabled: ${BOOKING_EXPIRATION_ENABLED:true}
    fixed-delay-ms: ${BOOKING_EXPIRATION_FIXED_DELAY_MS:30000}
    batch-size: ${BOOKING_EXPIRATION_BATCH_SIZE:100}
  services:
    theater:
      url: ${THEATER_SERVICE_URL:http://localhost:8082}
      connect-timeout: ${THEATER_CONNECT_TIMEOUT:3s}
      read-timeout: ${THEATER_READ_TIMEOUT:5s}
