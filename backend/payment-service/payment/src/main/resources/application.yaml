spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:payment_db}
    username: ${DB_USERNAME:cinebook}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: payment-service-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: payment-service-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}]"

payment:
  currency: VND
  processing:
    reconciliation-enabled: ${PAYMENT_RECONCILIATION_ENABLED:true}
    lease-seconds: ${PAYMENT_PROCESSING_LEASE_SECONDS:60}
    reconciliation-delay-ms: ${PAYMENT_RECONCILIATION_DELAY_MS:30000}
    reconciliation-batch-size: ${PAYMENT_RECONCILIATION_BATCH_SIZE:100}
  services:
    booking:
      url: ${BOOKING_SERVICE_URL:http://localhost:8083}
      service-key: ${BOOKING_SERVICE_KEY:local-dev-service-key}
      connect-timeout: ${BOOKING_CONNECT_TIMEOUT:3s}
      read-timeout: ${BOOKING_READ_TIMEOUT:5s}
