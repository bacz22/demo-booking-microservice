spring:
  application:
    name: theater-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:theater_db}
    username: ${DB_USERNAME:cinebook}
    password: ${DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: theater-service-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},traceId=%X{traceId:-},spanId=%X{spanId:-},correlationId=%X{correlationId:-}]"

cinebook:
  services:
    movie-service:
      base-url: ${MOVIE_SERVICE_URL:http://localhost:8081}
      connect-timeout-ms: ${MOVIE_SERVICE_CONNECT_TIMEOUT:3000}
      read-timeout-ms: ${MOVIE_SERVICE_READ_TIMEOUT:5000}

app:
  security:
    # Phải khớp api-gateway; để trống = tắt kiểm tra.
    gateway-secret: ${GATEWAY_SECRET:local-dev-gateway-secret}
