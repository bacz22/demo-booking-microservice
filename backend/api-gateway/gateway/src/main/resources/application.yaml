spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Thứ tự route quan trọng: route cụ thể đặt trước route /api/** của movie-service.
          routes:
            - id: auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/auth/**,/.well-known/**,/api/admin/users/**
            - id: theater
              uri: ${THEATER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/movies/{movieId}/showtimes,/api/theaters/**,/api/auditoriums/**,/api/showtimes/**,/api/admin/theaters/**,/api/admin/auditoriums/**,/api/admin/showtimes/**
            - id: booking
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/bookings/**,/api/admin/bookings/**
            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments/**,/api/admin/payments/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**
            - id: movie
              uri: ${MOVIE_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/**

app:
  jwt:
    issuer: cinebook-auth
    # Public key của auth-service; gateway cache và tự tải lại khi gặp kid lạ.
    jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
  security:
    # Gắn vào mọi request chuyển tiếp; service nghiệp vụ từ chối request thiếu/sai secret.
    gateway-secret: ${GATEWAY_SECRET:local-dev-gateway-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    # Số request tối đa mỗi cửa sổ (theo user nếu đã đăng nhập, ngược lại theo IP).
    window: 1m
    rules:
      - method: POST
        path: /api/auth/login
        limit: 10
      - method: POST
        path: /api/auth/register
        limit: 5
      - method: POST
        path: /api/bookings/hold
        limit: 20

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name:},correlationId=%X{correlationId:-}]"
